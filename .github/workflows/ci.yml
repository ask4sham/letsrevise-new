name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  taxonomy-validate:
    name: Taxonomy Validation (fast fail)
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install (backend only)
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Validate taxonomies
        working-directory: backend
        run: npm run validate:taxonomies

  backend:
    name: Backend (tests + taxonomy validation)
    needs: taxonomy-validate
    runs-on: ubuntu-latest
    env:
      CI: true
      # Full Jest suite loads app.js for integration tests; coverage doubles heap use on CI runners.
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install (backend)
        working-directory: backend
        run: npm ci

      - name: Validate taxonomies
        working-directory: backend
        run: npm run validate:taxonomies

      - name: Test (backend unit)
        working-directory: backend
        run: npm run test:unit -- --forceExit

  frontend:
    name: Frontend (build)
    needs: taxonomy-validate
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install (frontend)
        working-directory: frontend
        run: npm ci

      - name: Build (frontend)
        working-directory: frontend
        run: npm run build
