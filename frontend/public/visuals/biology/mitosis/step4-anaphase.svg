<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff"/>
  <ellipse cx="400" cy="400" rx="290" ry="268" fill="#cfe8fc" stroke="#4a90c8" stroke-width="6"/>
  <circle cx="400" cy="118" r="17" fill="#ffb84d" stroke="#e8890c" stroke-width="4"/>
  <circle cx="400" cy="682" r="17" fill="#ffb84d" stroke="#e8890c" stroke-width="4"/>
  <!-- Spindle -->
  <g stroke="#e8890c" stroke-width="5" stroke-linecap="round">
    <line x1="400" y1="135" x2="255" y2="330"/>
    <line x1="400" y1="135" x2="320" y2="370"/>
    <line x1="400" y1="135" x2="395" y2="410"/>
    <line x1="400" y1="135" x2="545" y2="330"/>
    <line x1="400" y1="135" x2="480" y2="370"/>
    <line x1="400" y1="665" x2="255" y2="470"/>
    <line x1="400" y1="665" x2="320" y2="430"/>
    <line x1="400" y1="665" x2="395" y2="390"/>
    <line x1="400" y1="665" x2="545" y2="470"/>
    <line x1="400" y1="665" x2="480" y2="430"/>
  </g>
  <!-- Sister chromatids as V-shapes (centromere split, each chromatid one arm) -->
  <!-- Left half moving to top pole -->
  <g stroke="#7b4faa" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M280 410 L240 320"/>
    <path d="M305 412 L265 310"/>
    <path d="M330 414 L290 302"/>
    <path d="M355 414 L315 308"/>
    <path d="M445 414 L485 302"/>
    <path d="M470 412 L510 310"/>
    <path d="M495 410 L535 320"/>
    <path d="M520 414 L560 308"/>
  </g>
  <!-- Centromere regions (where split happened) along mid line -->
  <circle cx="310" cy="412" r="7" fill="#a855dd" stroke="#4c1d74" stroke-width="2"/>
  <circle cx="400" cy="412" r="7" fill="#a855dd" stroke="#4c1d74" stroke-width="2"/>
  <circle cx="490" cy="412" r="7" fill="#a855dd" stroke="#4c1d74" stroke-width="2"/>
  <text x="360" y="448" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#4c1d74" font-weight="700">centromeres split</text>
  <!-- Direction arrows toward poles -->
  <g fill="#e8890c">
    <polygon points="250,280 268,288 252,295"/>
    <polygon points="550,280 532,288 548,295"/>
    <polygon points="250,520 268,512 252,505"/>
    <polygon points="550,520 532,512 548,505"/>
  </g>
  <text x="400" y="190" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#c9760f" font-weight="700">to pole</text>
  <text x="400" y="620" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#c9760f" font-weight="700">to pole</text>
  <text x="400" y="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#374151" font-weight="600">Anaphase</text>
</svg>
