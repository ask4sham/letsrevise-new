<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff"/>
  <!-- Cell -->
  <ellipse cx="400" cy="400" rx="290" ry="268" fill="#cfe8fc" stroke="#4a90c8" stroke-width="6"/>
  <!-- Nucleus -->
  <ellipse cx="400" cy="400" rx="220" ry="195" fill="#e8f3fd" stroke="#2563ab" stroke-width="5"/>
  <!-- Before: single chromosomes (one line each = unduplicated) -->
  <g fill="none" stroke="#9b7bc4" stroke-width="6" stroke-linecap="round">
    <line x1="290" y1="360" x2="290" y2="420"/>
    <line x1="330" y1="350" x2="330" y2="430"/>
    <line x1="370" y1="365" x2="370" y2="415"/>
  </g>
  <text x="330" y="455" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#5b4b7a">One chromatid each</text>
  <!-- Arrow -->
  <path d="M420 390 L480 390" stroke="#374151" stroke-width="4" fill="none" stroke-linecap="round"/>
  <polygon points="490,390 475,382 475,398" fill="#374151"/>
  <!-- After: duplicated X (two chromatids per chromosome) -->
  <g stroke="#7b4faa" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M510 365 L555 410 M555 365 L510 410"/>
    <path d="M560 355 L605 400 M605 355 L560 400"/>
    <path d="M610 365 L655 410 M655 365 L610 410"/>
  </g>
  <text x="585" y="455" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#5b4b7a">Duplicated</text>
  <text x="400" y="545" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#374151" font-weight="700">Chromosomes copied (2 chromatids)</text>
  <text x="400" y="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#374151" font-weight="600">DNA replication</text>
</svg>
