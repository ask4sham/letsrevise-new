<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff"/>
  <ellipse cx="400" cy="400" rx="290" ry="268" fill="#cfe8fc" stroke="#4a90c8" stroke-width="6"/>
  <!-- Breaking nuclear envelope -->
  <ellipse cx="400" cy="400" rx="218" ry="192" fill="none" stroke="#94a9c8" stroke-width="8" stroke-dasharray="22 14" opacity="0.95"/>
  <text x="400" y="218" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#64748b" font-weight="600">Envelope breaking apart</text>
  <!-- Centrosomes / poles -->
  <circle cx="400" cy="128" r="16" fill="#ffb84d" stroke="#e8890c" stroke-width="4"/>
  <circle cx="400" cy="672" r="16" fill="#ffb84d" stroke="#e8890c" stroke-width="4"/>
  <!-- Spindle forming -->
  <g stroke="#e8890c" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="400" y1="144" x2="320" y2="340"/>
    <line x1="400" y1="144" x2="370" y2="350"/>
    <line x1="400" y1="144" x2="400" y2="360"/>
    <line x1="400" y1="144" x2="430" y2="350"/>
    <line x1="400" y1="144" x2="480" y2="340"/>
    <line x1="400" y1="656" x2="320" y2="460"/>
    <line x1="400" y1="656" x2="370" y2="450"/>
    <line x1="400" y1="656" x2="400" y2="440"/>
    <line x1="400" y1="656" x2="430" y2="450"/>
    <line x1="400" y1="656" x2="480" y2="460"/>
  </g>
  <text x="548" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#c9760f" font-weight="700">Spindle forming</text>
  <!-- Thick condensed chromosomes -->
  <g stroke="#692f9e" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M305 395 L362 458 M362 395 L305 458"/>
    <path d="M388 382 L448 452 M448 382 L388 452"/>
    <path d="M465 392 L522 458 M522 392 L465 458"/>
    <path d="M342 442 L395 508 M395 442 L342 508"/>
    <path d="M418 438 L478 498 M478 438 L418 498"/>
  </g>
  <text x="400" y="630" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#374151" font-weight="700">Chromosomes shorten and thicken</text>
  <text x="400" y="700" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#374151" font-weight="600">Prophase</text>
</svg>
