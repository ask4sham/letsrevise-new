# Netlify build config for LetsRevise frontend
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Dashboard should match file-based settings (avoid duplicate/conflicting overrides):
#   Base directory:   frontend   (same as `base` below — Netlify cds here before install/build)
#   Build command:    npm run build
#   Publish directory: build       (relative to base, i.e. frontend/build output)
#
# If a deploy fails, open Deploy log on Netlify and copy the FIRST "Failed" npm/tsc/babel line —
# guesses here cannot replace that line.

[build.environment]
  # CRA + large bundles: avoid OOM on small Netlify builders
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max_old_space_size=4096"
  # Netlify sets CI=true; CRA treats warnings as failures. ESLint is disabled in build script,
  # but TS/webpack warnings can still fail under CI in edge cases.
  CI = "false"

[build]
  base = "frontend"
  command = "npm run build"
  publish = "build"

# Proxy API and static assets to Render backend — avoids CORS, uploads and images work same-origin
[[redirects]]
  from = "/api/*"
  to = "https://letsrevise-new.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://letsrevise-new.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/visuals/*"
  to = "https://letsrevise-new.onrender.com/visuals/:splat"
  status = 200
  force = true

# SPA fallback: serve index.html for client-side routes (HashRouter uses /#/path)
# Must be last so /api/*, /uploads/*, /visuals/* take precedence
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# REACT_APP_API_BASE: Set to backend URL (https://letsrevise-new.onrender.com) for non-proxy builds.
# On Netlify, api.ts uses same-origin so /api/* is proxied. Upload/visual URLs use same-origin paths; these redirects proxy /uploads and /visuals to Render.
